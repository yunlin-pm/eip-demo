<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>員工管理內容頁｜Bibian EIP Demo</title><link rel="stylesheet" href="../../assets/css/tokens.css"><link rel="stylesheet" href="../../assets/css/base.css"><link rel="stylesheet" href="../../assets/css/shell.css"><link rel="stylesheet" href="../../assets/css/eip-layout.css"><link rel="stylesheet" href="../../assets/css/claim-detail.css"><link rel="stylesheet" href="../../assets/css/permission-matrix.css"><link rel="stylesheet" href="../../assets/css/employee.css"></head><body class="eip-shared-layout" data-eip-root="../../" data-eip-module="organization" data-eip-sections="organization,employees,permission-groups,signoff-groups" data-eip-l2="employees" data-eip-l3="" data-eip-user="陳庭瑋 (T037)">
<header class="eip-shell-bar demo-preview-bar"><a class="eip-shell-brand demo-preview-brand" href="../../index.html" aria-label="返回系統功能目錄"><span class="demo-back" aria-hidden="true">‹</span><b class="demo-badge">Demo</b><strong>Bibian EIP</strong></a></header><div id="eipAppHeader"></div>
<header class="top"><b>▦　組織／員工</b><span class="user">網家跨境服務股份有限公司　陳庭瑋 (T037)</span></header>
<main><div class="crumb">總覽　›　組織／員工　›　員工管理</div><div class="toolbar"><button class="btn" type="button" onclick="location.href='list.html'">← 返回列表</button><button class="btn primary" type="button" onclick="saveEmployee()">儲存</button></div>
<div class="main">
<section class="panel"><h2><span id="detailTitle">新增員工</span></h2><div class="body emp-basic-body">
<div class="emp-demand-grid">
<label><span class="label">帳號系統編號</span><span class="control-static" id="empIdView">—</span></label>
<label><span class="label req">帳號姓名</span><input class="control" id="empName" placeholder="請輸入帳號姓名"></label>
<label><span class="label req">員工編號</span><input class="control" id="empCode" placeholder="請輸入員工編號"></label>
<label><span class="label req">登入帳號</span><input class="control" id="empLogin" placeholder="sample@japan-import.com.tw"><small class="field-note">※ 請輸入 Google Workspace 帳號</small></label>
<label><span class="label req">通知Email</span><input class="control" id="empEmail" placeholder="sample@japan-import.com.tw"><small class="field-note">預設帶入「登入帳號」，可另行修改</small></label>
<label><span class="label">帳號暱稱</span><input class="control" id="empNickname" placeholder="請輸入帳號暱稱"></label>
<label><span class="label req">帳號語系</span><select class="control" id="empLocale"><option>繁體中文</option><option>English</option><option>日本語</option></select></label>
<label><span class="label req">帳號時區</span><select class="control" id="empTimezone"><option>Asia /Taipei</option><option>Asia /Tokyo</option><option>UTC</option></select></label>
</div>
<div class="emp-avatar-box"><span class="label">帳號頭像</span><div class="avatar" id="avatarPreview"></div><div class="emp-avatar-actions"><button type="button" onclick="uploadAvatar()">上傳</button><span>｜</span><button type="button" onclick="deleteAvatar()">刪除</button></div></div>
</div></section>

<section class="panel"><h2>帳號對應公司組織</h2><div class="body"><div class="table-scroll"><table class="detail-table"><thead><tr><th>公司</th><th>歸屬部門</th><th></th></tr></thead><tbody id="empOrgEditRows"></tbody></table></div><button class="mini" type="button" id="addOrgRow">＋ 新增</button>
<div class="emp-org-add" id="empOrgAddPanel" hidden><label><span class="label req">公司</span><select class="control" id="empOrgAddCompany"></select></label><label><span class="label req">歸屬部門</span><select class="control" id="empOrgAddDepartment"></select></label><div class="emp-org-add-actions"><button class="btn" type="button" id="cancelOrgRow">取消</button><button class="btn primary" type="button" id="confirmOrgRow">確認新增</button></div></div>
<p class="field-note">每個帳號至少須有一筆公司組織；既有資料僅能查看或刪除，如需調整公司或部門，請刪除原資料後重新新增。</p></div></section>

<section class="panel"><h2>系統權限</h2><div class="body">
<div class="cloud-question"><span class="label req">系統權限</span><div class="cloud-choices"><label><input type="radio" name="permMode" value="custom" id="permCustom"> 自訂</label><label><input type="radio" name="permMode" value="group" id="permGroup" checked> 指定系統權限群組：</label><select class="control" id="permGroupSelect"><option value="">請選擇群組</option><option>行政人員</option><option>部門主管</option><option>系統管理員</option></select></div></div>
<div class="perm-block" data-perm-block="group"><div id="permGroupPreview"></div><p class="field-note">群組內容由「<a href="../permission-groups/list.html">系統權限群組管理</a>」統一維護，此處僅預覽該群組已授予的權限。</p></div>
<div class="perm-block" data-perm-block="custom" hidden><p class="field-note">自訂此帳號可操作的功能：逐項勾選各功能的操作權限。</p><p class="pm-legend"><b>灰色打勾</b>＝所有內部帳號預設具有，不可取消。</p><div id="permCustomMatrix"></div></div>
</div></section>
</div>
</main>
<div class="emp-toast" id="empToast"></div>
<script src="../../assets/js/permission-matrix.js"></script><script src="../../assets/js/employee-data.js"></script><script src="../../assets/js/signoff-group-data.js"></script><script src="../../assets/js/department-data.js"></script><script src="../../assets/js/employee.js"></script><div id="eipAppFooter"></div><script src="../../assets/js/eip-layout.js"></script></body></html>
