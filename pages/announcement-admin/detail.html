<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公告管理內容｜Bibian EIP Demo</title><link rel="stylesheet" href="../../assets/css/tokens.css"><link rel="stylesheet" href="../../assets/css/base.css"><link rel="stylesheet" href="../../assets/css/shell.css"><link rel="stylesheet" href="../../assets/css/eip-layout.css"><link rel="stylesheet" href="../../assets/css/memo.css"><link rel="stylesheet" href="../../assets/css/announcement.css"></head>
<body class="eip-shared-layout ann-admin-detail" data-eip-root="../../" data-eip-module="announcement" data-eip-sections="announcement-admin" data-eip-l2="announcement-admin" data-eip-l3="" data-eip-user="陳庭瑋 (T037)"><header class="eip-shell-bar demo-preview-bar"><a class="eip-shell-brand demo-preview-brand" href="../../index.html" aria-label="返回系統功能目錄"><span class="demo-back" aria-hidden="true">‹</span><b class="demo-badge">Demo</b><strong>Bibian EIP</strong></a><label class="demo-scenario">畫面情境<select id="mode"><option value="new">新增</option><option value="edit">編輯</option></select></label></header><div id="eipAppHeader"></div>
<main class="memo-page ann-admin-page"><div class="crumb">總覽　›　公告設定　›　<a href="list.html">公告管理</a>　›　公告管理內容</div>
<div class="toolbar"><a class="btn" href="list.html">← 返回</a><button class="btn primary" id="saveBtn" type="button">儲存</button></div>
<section class="panel"><h2><span id="pageTitle">新增公告</span><small id="metaInfo"></small></h2><div class="panel-body ann-rows">
  <div class="ann-row"><span class="label req">公告公司</span><div class="ann-choices" id="companies"><label><input type="checkbox" name="company" value="CBS"> 網家跨境服務股份有限公司</label><label><input type="checkbox" name="company" value="BBN"> 比比昂株式會社</label><label><input type="checkbox" name="company" value="ASL"> 空中補給股份有限公司</label></div></div>
  <div class="ann-row"><span class="label req">公告類型</span><div class="ann-choices"><label><input type="radio" name="type" value="一般公告"> 一般公告</label><label><input type="radio" name="type" value="人事公告"> 人事公告</label><label><input type="radio" name="type" value="資訊公告"> 資訊公告</label><label><input type="radio" name="type" value="活動公告"> 活動公告</label></div></div>
  <div class="ann-row"><label class="label req" for="title">公告標題</label><div class="ann-field"><input class="control" id="title" maxlength="30" placeholder="請輸入公告標題"><small class="field-note"><span id="titleCount">0</span> / 30 字</small></div></div>
  <div class="ann-row"><label class="label req" for="summary">公告摘要</label><div class="ann-field"><textarea class="control" id="summary" rows="2" maxlength="50" placeholder="顯示於總覽與公告列表，請以 1～2 句說明重點"></textarea><small class="field-note"><span id="summaryCount">0</span> / 50 字</small></div></div>
  <div class="ann-row"><label class="label req" for="date">發佈日期</label><div class="ann-field"><input class="control ann-date" id="date" type="date"></div></div>
  <div class="ann-row"><label class="label" for="expiry">到期日期</label><div class="ann-field"><input class="control ann-date" id="expiry" type="date"><small class="field-note">未填寫表示不到期；到期日當天仍會顯示</small></div></div>
  <div class="ann-row"><span class="label req">置頂</span><div class="ann-choices"><label><input type="radio" name="pinned" value="1"> 是</label><label><input type="radio" name="pinned" value="0"> 否</label></div></div>
  <div class="ann-row"><span class="label req">發佈公告</span><div class="ann-field"><div class="ann-choices"><label><input type="radio" name="published" value="1"> 是（於發佈日～到期日顯示）</label><label><input type="radio" name="published" value="0"> 否（一律隱藏）</label></div></div></div>
  <div class="ann-row"><span class="label req">發送 Email 通知</span><div class="ann-field"><div class="ann-choices"><label><input type="radio" name="notify" value="0"> 不通知</label><label><input type="radio" name="notify" value="1"> 通知「公告公司」全體員工</label></div><small class="field-note" id="notifyNote" hidden>將寄送給已勾選公告公司的全體在職員工：發佈日當天寄出（若儲存時已過發佈日則立即寄出），每則公告只寄一次；發佈公告為「否」時不寄送。</small></div></div>
</div></section>
<section class="panel"><h2><span class="req">公告內容</span></h2><div class="panel-body"><div class="editor"><div class="editor-toolbar"><button type="button" data-command="bold"><b>B</b></button><button type="button" data-command="italic"><i>I</i></button><button type="button" data-command="insertUnorderedList">• 清單</button><label class="editor-select-label">大小<select id="editorSize"><option value="3">一般</option><option value="4">大</option><option value="5">特大</option></select></label><label class="editor-color-label">顏色<input id="editorColor" type="color" value="#1f2d3d" title="文字顏色"></label><button type="button" data-command="createLink">連結</button></div><div class="rich-editor control" id="content" contenteditable="true" data-placeholder="請輸入公告內容"></div></div></div></section>
<section class="panel"><h2>公告附件</h2><div class="panel-body"><div class="attachment-area" id="files"><button class="upload-btn" id="uploadBtn" type="button">📎 選擇上傳附件</button></div><div class="help">選填。單一檔案最大 5 MB，最多 20 個檔案。</div></div></section>
</main>
<div id="eipAppFooter"></div><script src="../../assets/js/eip-layout.js"></script><script src="../../assets/js/announcement-data.js"></script><script src="../../assets/js/announcement-admin-detail.js"></script></body></html>
