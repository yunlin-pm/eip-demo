<section class="panel"><h2><span id="detailTitle">新增群組</span>（<b id="pgIdView">新增後由系統產生</b>）</h2><div class="body pg-demand-grid">
<label><span class="label req">群組名稱</span><input class="control" id="pgName" placeholder="請輸入群組名稱，例如：行政人員"></label>
<label><span class="label">說明</span><input class="control" id="pgDesc" maxlength="30" placeholder="請輸入群組用途說明（最多 30 字）"></label>
</div></section>

<section class="panel"><h2>權限內容</h2><div class="body"><p class="field-note">設定此群組的成員在系統裡能操作的功能範圍；帳號指定此群組後，即自動取得下列權限。逐項勾選各功能的操作權限。</p><p class="pm-legend"><b>灰色打勾</b>＝所有內部帳號預設具有，不可取消。</p><div id="pgPermMatrix"></div></div></section>

<section class="panel"><h2>成員</h2><div class="body"><div class="table-scroll"><table class="detail-table"><thead><tr><th>帳號系統編號</th><th>員工編號</th><th>帳號姓名</th><th>帳號暱稱</th><th>登入帳號</th><th>部門</th></tr></thead><tbody id="pgMemberRows"></tbody></table></div><p class="field-note">成員僅供查看（只列啟用中的帳號）；帳號屬於哪個群組，請至「<a href="../employees/list.html">員工管理</a>」的系統權限設定指定。</p></div></section>
</div>
</main>
